id: meeting-agenda
title: "Draft a meeting agenda"
task_category: planning
prompt_text: |
  Create a [duration]-minute agenda for [purpose] using only these supplied topics and constraints. Allocate time that sums to the duration. Mark any missing facilitator or decision owner as a placeholder.
expected_answer: >-
  Timed agenda whose segments sum correctly and cover supplied topics.
known_failure_cases:
  - "Time totals do not add up; invented attendees or decisions; unrealistic allocation."
verification_steps:
  - "Recalculate total time; check topics and constraints; confirm owners and decisions with organizer."
