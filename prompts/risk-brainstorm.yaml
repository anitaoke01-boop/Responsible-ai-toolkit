id: risk-brainstorm
title: "Brainstorm project risks"
task_category: risk-analysis
prompt_text: |
  Given this synthetic project description, list possible risks, causes, early indicators, and practical mitigations. Label these as hypotheses to review, not established facts. Include missing information that would change the assessment.
expected_answer: >-
  A structured brainstorm with uncertainty labels and actionable checks, without asserting unprovided facts.
known_failure_cases:
  - "Generic risks; presenting speculation as fact; overlooking affected groups; false completeness."
verification_steps:
  - "Ask project owner and affected stakeholders; check controls and context; do not treat list as exhaustive."
