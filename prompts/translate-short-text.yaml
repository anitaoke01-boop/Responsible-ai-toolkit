id: translate-short-text
title: "Translate short workplace text"
task_category: translation
prompt_text: |
  Translate the supplied text into [language]. Preserve names, numbers, dates, tone, and uncertainty. Do not add explanation. Flag any phrase with multiple plausible meanings and provide alternatives separately.
