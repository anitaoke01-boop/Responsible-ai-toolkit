id: synthetic-test-cases
title: "Create synthetic test cases"
task_category: testing
prompt_text: |
  Create [number] clearly synthetic test cases for [workflow]. Include input, expected behavior, and edge case. Use fictional labels and values; do not use real personal or confidential information.
expected_answer: >-
  Distinct, labeled test cases including ordinary, boundary, and failure inputs with expected behavior.
known_failure_cases:
  - "Accidental real data; expected result contradicts specification; insufficient edge cases."
verification_steps:
  - "Scan for personal details; compare expectations with requirements; have workflow owner approve cases."
