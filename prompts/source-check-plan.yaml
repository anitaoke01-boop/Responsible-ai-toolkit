id: source-check-plan
title: "Plan verification of claims"
task_category: research-planning
prompt_text: |
  For each claim in the supplied draft, identify what evidence would verify it and the best kind of source to consult. Do not invent sources, links, or findings. Mark time-sensitive claims for a current check.
expected_answer: >-
  Claim-by-claim verification plan with source type and clear check criteria.
known_failure_cases:
  - "Fabricated citation; weak source type; failure to identify changing information."
verification_steps:
  - "Locate sources independently; check authority, date, and direct support; record result and access date."
